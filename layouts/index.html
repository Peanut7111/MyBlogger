<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
    <link rel="stylesheet" href="./css/zelda.css">
</head>
<body>
    <!-- 海拉鲁大陆背景 -->
    <div class="body-bg"></div>
    <div class="body-overlay"></div>

    {{ partial "header.html" . }}

    <div class="container">
        <main class="main-content">
            <h1 class="home-title" style="text-align: center; color: #1a1a1a; margin-bottom: 30px;">
                ⚔️ Peanut的冒险日志 ⚔️
            </h1>

            <p class="site-description" style="text-align: center; color: #3a3a3a; margin-bottom: 30px; font-size: 1.2rem;">
                {{ .Site.Params.description }}
            </p>

            <!-- 博客介绍 -->
            <div class="home-intro" style="text-align: center; padding: 40px 20px; border-bottom: 3px solid var(--zelda-gold); margin-bottom: 30px;">
                <p style="font-size: 1.15rem; line-height: 1.8; color: #3a3a3a; max-width: 700px; margin: 0 auto;">
                    欢迎来到 Peanut 的冒险日志！这里记录着我的学习笔记、技术探索和随想。<br>
                    点击导航栏的「📝 文章」即可查看所有博客内容。
                </p>
                <div style="margin-top: 25px;">
                    <a href="./posts/" class="read-more" style="font-size: 1rem; padding: 10px 30px;">📝 进入文章列表</a>
                </div>
            </div>
        </div>
        </main>
    </div>

    {{ partial "footer.html" . }}

    <script>
        // 背景虚化控制 - 双击切换
        (function() {
            var blurred = localStorage.getItem('bgBlur') === 'true';
            var bodyBg = document.querySelector('.body-bg');
            var bodyOverlay = document.querySelector('.body-overlay');
            function applyBlur(blur) {
                if (bodyBg) bodyBg.style.filter = blur ? 'blur(50px) brightness(0.7)' : 'blur(0)';
                if (bodyOverlay) bodyOverlay.style.backdropFilter = blur ? 'blur(2px)' : 'blur(0px)';
            }
            applyBlur(blurred);
            document.addEventListener('dblclick', function() {
                blurred = !blurred;
                applyBlur(blurred);
                localStorage.setItem('bgBlur', blurred);
            });
        })();
    </script>
</body>
</html>
